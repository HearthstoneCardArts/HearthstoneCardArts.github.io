<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearthstone Card Arts</title>
<meta name="description" content="Search Hearthstone card arts by card name in multiple languages. Find official card illustrations fast and share direct links.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://hearthstonecardarts.github.io/">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

<meta property="og:title" content="Hearthstone Card Arts">
<meta property="og:description" content="Search Hearthstone card arts by card name in multiple languages.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hearthstonecardarts.github.io/">
<meta property="og:image" content="https://hearthstonecardarts.github.io/logo.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Hearthstone Card Arts",
  "url": "https://hearthstonecardarts.github.io/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://hearthstonecardarts.github.io/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
</head>
<body>
<div class="search-container">
  <img src="logo.png" alt="Hearthstone Card Arts logo" class="search-image">

  <p class="site-description">
    Search Hearthstone card arts by card name across multiple languages. Share links like ?q=Lord+Jaraxxus.
  </p>

  <form id="searchForm" class="search-form">
    <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
    </svg>

    <input type="text"
      class="search-input"
      id="cardName"
      placeholder="For example:"
      autocomplete="off"
      list="cardSuggestions"
      required>

    <datalist id="cardSuggestions"></datalist>

    <div class="locale-picker">
      <button type="button" id="localeButton" class="locale-button" aria-label="Choose language">
        <span id="localeFlag">🇺🇸</span>
      </button>
      <div id="localeDropdown" class="locale-dropdown"></div>
    </div>
    <button type="submit" class="search-button" id="searchBtn">
      Search
    </button>
  </form>

  <div id="loading" class="loading" style="display: none;">Searching...</div>
  <div id="errorMessage" class="error-message"></div>

  <div class="art-result" id="artResult"></div>

  <div class="misc-text">
    <a href="https://github.com/HearthstoneCardArts/HearthstoneCardArts.github.io" target="_blank" rel="noopener noreferrer">Source code</a>
    powered by hearthstonejson api 💙
  </div>
</div>

<script src="search.js"></script>
</body>
</html>
